
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vehicle Condition Report v2.7.0</title>
    
    <script>
        (function() {
            var p = "ht" + "tps://";
            document.write('<link rel="stylesheet" href="' + p + 'fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap">');
            document.write('<script src="' + p + 'unpkg.com/react@18/umd/react.production.min.js"><\/script>');
            document.write('<script src="' + p + 'unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
            document.write('<script src="' + p + 'unpkg.com/@babel/standalone/babel.min.js"><\/script>');
            document.write('<script src="' + p + 'cdn.tailwindcss.com"><\/script>');
        })();
    </script>
    
    <style>
        :root { --app-height: 100dvh; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            margin: 0; 
            padding: 0;
            height: var(--app-height);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #root { height: 100%; display: flex; flex-direction: column; }

        main {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 240px; 
            -webkit-overflow-scrolling: touch;
        }

        .scroll-spacer { height: 180px; width: 100%; }

        canvas { 
            touch-action: none; 
            cursor: crosshair; 
            background: #ffffff; 
            border: 2px dashed #cbd5e1; 
            border-radius: 1.5rem; 
            width: 100%; 
            height: 300px; 
            display: block; 
        }

        .no-print { display: block; }
        
        @media print { 
            @page { margin: 10mm; size: A4 portrait; }
            .no-print { display: none !important; } 
            
            html, body, #root, main, .h-full { 
                display: block !important; 
                height: auto !important; 
                min-height: auto !important; 
                overflow: visible !important; 
                position: static !important; 
                background: white !important;
                width: 100% !important; 
                margin: 0 !important;
                padding: 0 !important;
            }
            
            main { max-width: none !important; }
            
            .preview-auto-scale-wrapper {
                height: auto !important;
                overflow: visible !important;
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .preview-auto-scale-content {
                position: relative !important;
                transform: none !important;
                width: 100% !important;
            }

            #final-document-render {
                border: none !important;
                border-radius: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                box-shadow: none !important;
                background: white !important;
                margin: 0 !important;
            }

            .pdf-avoid-break { page-break-inside: avoid !important; break-inside: avoid !important; }
        }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes initSpin { 100% { transform: rotate(360deg); } }
        .init-spinner { animation: initSpin 1s linear infinite; }

        header.app-header {
            position: relative;
            height: 70px;
            background-color: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
            width: 100%;
        }
        
        .header-logo-section { display: flex; align-items: center; gap: 12px; }

        .abbruch-btn-fixed {
            position: absolute !important;
            right: 16px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            background-color: #dc2626 !important;
            color: white !important;
            padding: 10px 16px !important;
            border-radius: 9999px !important;
            font-size: 11px !important;
            font-weight: 900 !important;
            text-transform: uppercase !important;
            border: 2px solid #ef4444 !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
            white-space: nowrap !important;
            z-index: 1001 !important;
        }
        .abbruch-btn-fixed:active { transform: translateY(-50%) scale(0.95) !important; }

        .progress-bar-inner { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-table { display: table !important; table-layout: fixed !important; width: 100% !important; height: 100% !important; }
        .nav-cell { display: table-cell !important; vertical-align: middle !important; text-align: center !important; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; font-family:sans-serif; color:#0f172a; text-align:center; padding: 20px;">
            <div style="font-weight:900; font-size:1.5rem; margin-bottom:15px; font-style: italic;">VEHICLE REPORT</div>
            <div style="width: 40px; height: 40px; border: 4px solid #cbd5e1; border-top-color: #3b82f6; border-radius: 50%; margin-bottom: 20px;" class="init-spinner"></div>
            <div style="font-weight:bold; font-size:1rem; margin-bottom:5px;">System v2.7.0 (Final) startet...</div>
            <div style="font-size:0.75rem; color:#64748b;">Bitte warten. Module werden geladen.</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useLayoutEffect } = React;
        const APP_VERSION = "v2.7.0";

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                plus: <g><path d="M12 5v14M5 12h14" /></g>,
                check: <g><path d="M20 6L9 17l-5-5" /></g>,
                car: <g><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.3 1 12.1 1 13v3c0 .6.4 1 1 1h2m12 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0ZM5 17a2 2 0 1 0 4 0 2 2 0 1 0-4 0Z" /></g>,
                camera: <g><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></g>,
                trash: <g><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></g>,
                refresh: <g><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></g>,
                back: <g><path d="M19 12H5M12 19l-7-7 7-7" /></g>,
                shield: <g><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></g>,
                doc: <g><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></g>,
                pen: <g><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></g>,
                alert: <g><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></g>,
                warning: <g><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>,
                image: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></g>,
                disc: <g><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></g>,
                layout: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></g>,
                zap: <g><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></g>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const ProtocolDocument = ({ mode, formData, essentials, carDamage, guidedPhotos, generalPhotos, signature }) => {
            const dateStr = formData.date ? new Date(formData.date).toLocaleDateString('de-DE') : '---';
            const isElectric = ['Elektro', 'Hybrid'].includes(formData.fuelType);

            const locLen = (formData.location || '').length;
            const locSize = locLen > 18 ? '10px' : locLen > 12 ? '11px' : '12px';
            const plateLen = (formData.plate || '').length;
            const plateSize = plateLen > 10 ? '12px' : '15px';

            const renderPhotoGrid = (list, title) => {
                const activePhotos = list.filter(item => guidedPhotos[item.id]);
                if (activePhotos.length === 0) return null;
                return (
                    <div className="mb-6 pdf-avoid-break">
                        <p className="text-[14px] font-black text-black uppercase mb-3 tracking-widest border-b-2 border-black pb-1">{title}</p>
                        <div className="grid grid-cols-4 gap-4 mt-2">
                            {activePhotos.map(item => (
                                <div key={item.id} className="text-center">
                                    <img src={guidedPhotos[item.id]} className="w-full aspect-square object-cover rounded-lg border-2 border-gray-400" />
                                    <p className="text-[10px] font-bold uppercase mt-1 text-black">{item.l}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div id="final-document-render" className="bg-white p-8 text-black text-left mx-auto" style={{ width: '750px', maxWidth: '750px', minHeight: '1050px' }}>
                    <div className="flex justify-between items-start border-b-4 border-black pb-4 mb-6">
                        <div>
                            <p className="text-[10px] font-bold text-gray-500 tracking-widest uppercase mb-1">Vehicle Condition Report</p>
                            <h1 className="text-3xl font-black italic uppercase m-0 leading-tight text-black">{mode === 'pickup' ? 'Übernahme-Protokoll' : 'Rückgabe-Protokoll'}</h1>
                        </div>
                        <div className="text-right text-black">
                            <p className="text-[10px] font-bold text-gray-500 tracking-widest uppercase mb-1">{mode === 'pickup' ? 'Übernahme am' : 'Rückgabe am'}</p>
                            <p className="text-[16px] font-black">{dateStr}</p>
                        </div>
                    </div>
                    
                    <div className="flex justify-between gap-6 mb-8 text-[13px] leading-snug">
                        <div className="bg-gray-100 p-4 rounded-lg border-2 border-gray-400 flex-1 w-1/2">
                            <table className="w-full text-left border-collapse table-fixed">
                                <colgroup><col style={{width: '80px'}}/><col style={{width: 'calc(100% - 80px)'}}/></colgroup>
                                <tbody>
                                    <tr><td className="font-bold text-gray-500 uppercase pb-2 align-top">Mieter:</td><td className="font-black align-top pb-2 break-words">{formData.renterName || '---'}</td></tr>
                                    <tr><td className="font-bold text-gray-500 uppercase pb-2 align-top">Verm.:</td><td className="font-black align-top pb-2 break-words">{formData.rentalCompany || '---'}</td></tr>
                                    <tr><td className="font-bold text-gray-500 uppercase pb-2 align-top">Ort:</td><td className="font-black align-top pb-2 break-words" style={{fontSize: locSize}}>{formData.location || '---'}</td></tr>
                                    <tr><td className="font-bold text-blue-800 uppercase pt-2 border-t border-gray-300 align-top">Übergabe:</td><td className="font-black text-blue-800 pt-2 align-top">{formData.handoverType}</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div className="bg-gray-100 p-4 rounded-lg border-2 border-gray-400 flex-1 w-1/2">
                            <table className="w-full text-left border-collapse table-fixed">
                                <colgroup><col style={{width: '80px'}}/><col style={{width: 'calc(100% - 80px)'}}/></colgroup>
                                <tbody>
                                    <tr><td className="font-bold text-gray-500 uppercase pb-2 align-top">Modell:</td><td className="font-black text-blue-800 text-[15px] align-top pb-2 break-words">{formData.model || '---'}</td></tr>
                                    <tr><td className="font-bold text-gray-500 uppercase pb-2 align-top">Kennz.:</td><td className="font-black text-[16px] align-top pb-2 break-words" style={{fontSize: plateSize}}>{formData.plate || '---'}</td></tr>
                                    <tr><td className="font-bold text-black uppercase pt-2 border-t border-gray-300 align-top">Stand:</td><td className="font-black text-black pt-2 align-top">{formData.kilometers ? formData.kilometers.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") : '0'} KM <br/>TANK: {formData.fuelLevel || '0'}%</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="mb-8 p-5 border-2 border-gray-400 rounded-xl bg-white">
                        <p className="text-[13px] font-black text-black uppercase mb-4 tracking-widest border-b-2 border-black pb-2 text-center">Zubehör-Checkliste</p>
                        <div className="grid grid-cols-2 gap-x-12 gap-y-3 text-[12px]">
                            <div className="flex items-center justify-between border-b border-gray-300 py-1 pr-2"><span className="uppercase text-black font-bold mr-2">Schlüssel:</span><span className="font-black flex-shrink-0">{formData.keyCount}</span></div>
                            {Object.entries(essentials).map(([k,v]) => {
                                if (k === 'chargingCable' && !isElectric) return null;
                                const labels = { docs: 'Papiere', vest: 'Weste', triangle: 'Dreieck', firstAid: 'Verband', mats: 'Matten', spareTire: 'Rad-Set', chargingCable: 'Ladekabel' };
                                return (<div key={k} className="flex items-center justify-between border-b border-gray-300 py-1 pr-2"><span className="uppercase text-black font-bold mr-2">{labels[k]}:</span><span className={`font-black flex-shrink-0 ${v === true ? 'text-green-700' : v === false ? 'text-red-700' : 'text-gray-500'}`}>{v === true ? 'DA' : v === false ? 'FEHLT' : 'N/A'}</span></div>);
                            })}
                        </div>
                    </div>

                    {renderPhotoGrid([{id:'frontLeft',l:'Vorne Links'},{id:'frontRight',l:'Vorne Rechts'},{id:'backLeft',l:'Hinten Links'},{id:'backRight',l:'Hinten Rechts'}], "Fahrzeug-Perspektiven")}
                    {renderPhotoGrid([{id:'wheelFL',l:'Rad VL'},{id:'wheelFR',l:'Rad VR'},{id:'wheelBL',l:'Rad HL'},{id:'wheelBR',l:'Rad HR'}], "Räder & Felgen")}
                    {renderPhotoGrid([{id:'dash',l:'Tacho / KM'},{id:'interior',l:'Innenraum'}], "Cockpit & Innenraum")}

                    {Object.values(carDamage).some(d => d.active) && (
                        <div className="mt-8 pdf-avoid-break">
                            <p className="text-[14px] font-black text-red-700 uppercase mb-3 tracking-widest border-b-2 border-red-700 pb-1">Mängelbericht</p>
                            <div className="space-y-4">
                                {Object.entries(carDamage).map(([zone, data]) => data.active && (
                                    <div key={zone} className="border-2 border-gray-400 p-3 rounded-lg flex gap-4 bg-white pdf-avoid-break">
                                        <div className="w-[100px] text-center border-r-2 border-gray-400 pr-3 flex flex-col justify-center"><p className="text-[12px] font-black text-black uppercase tracking-tight">{data.label}</p><span className="bg-red-700 text-white px-2 py-1 rounded font-black text-[10px] mx-auto mt-2">MANGEL</span></div>
                                        <div className="flex-1 flex gap-4 items-center overflow-hidden">{data.photo && <img src={data.photo} className="w-24 h-24 object-cover rounded-lg border-2 border-gray-400 shrink-0" />}<p className="text-[13px] font-bold italic text-black flex-1 leading-snug break-words">"{data.note || 'Mangel dokumentiert.'}"</p></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {generalPhotos && generalPhotos.length > 0 && (
                        <div className="mt-8 pdf-avoid-break">
                            <p className="text-[14px] font-black text-black uppercase mb-3 tracking-widest border-b-2 border-black pb-1">Weitere Beweise</p>
                            <div className="grid grid-cols-4 gap-4">{generalPhotos.map((p, i) => <img key={i} src={p.url} className="w-full aspect-square object-cover rounded-lg border-2 border-gray-400" />)}</div>
                        </div>
                    )}

                    <div className="mt-16 flex justify-between items-end border-t-4 border-black pt-6 text-[11px] text-black pdf-avoid-break">
                        <div className="font-bold uppercase italic leading-relaxed tracking-tight break-words flex-1 pr-4" style={{ maxWidth: '450px' }}>Bericht erstellt am {new Date().toLocaleString('de-DE')} <br/> MIT DER VEHICLE CONDITION REPORT APP {APP_VERSION}.</div>
                        <div className="text-center shrink-0" style={{ width: '250px', minWidth: '250px' }}>{signature ? <img src={signature} className="h-20 mx-auto border-b-2 border-black pb-2 mb-2 object-contain" /> : <div className="h-20 border-b-2 border-black mb-2 w-full"></div>}<p className="font-black mt-2 pt-1 uppercase tracking-widest break-words">{formData.renterName || 'UNTERSCHRIFT MIETER'}</p></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [step, setStep] = useState('mode');
            const [mode, setMode] = useState('pickup');
            const [showError, setShowError] = useState(false);
            const [showPhotoWarning, setShowPhotoWarning] = useState(false);
            const [generalPhotos, setGeneralPhotos] = useState([]);
            const [signature, setSignature] = useState(null);

            const [formData, setFormData] = useState({ plate: '', model: '', kilometers: '', fuelLevel: '100', renterName: '', rentalCompany: '', location: '', fuelType: 'Benzin', handoverType: 'Persönlich', date: new Date().toISOString().split('T')[0], keyCount: 1 });
            const [essentials, setEssentials] = useState({ docs: null, vest: null, triangle: null, firstAid: null, mats: null, spareTire: null, chargingCable: null });
            const [guidedPhotos, setGuidedPhotos] = useState({ frontLeft: null, frontRight: null, backLeft: null, backRight: null, wheelFL: null, wheelFR: null, wheelBL: null, wheelBR: null, dash: null, interior: null });
            const [carDamage, setCarDamage] = useState({ front: { active: false, note: '', photo: null, label: 'Vorne' }, back: { active: false, note: '', photo: null, label: 'Hinten' }, left: { active: false, note: '', photo: null, label: 'Links' }, right: { active: false, note: '', photo: null, label: 'Rechts' }, roof: { active: false, note: '', photo: null, label: 'Dach' }, wheels: { active: false, note: '', photo: null, label: 'Felgen' }, glass: { active: false, note: '', photo: null, label: 'Glas' } });

            const canvasRef = useRef(null);
            const previewWrapperRef = useRef(null);
            const previewContentRef = useRef(null);
            const isDrawing = useRef(false);

            const updatePreviewScale = () => {
                if (step === 'summary' && previewWrapperRef.current && previewContentRef.current) {
                    const wrapperWidth = previewWrapperRef.current.clientWidth;
                    const scaleFactor = wrapperWidth / 750;
                    if (scaleFactor < 1) {
                        previewContentRef.current.style.transform = `scale(${scaleFactor})`;
                        previewWrapperRef.current.style.height = `${previewContentRef.current.offsetHeight * scaleFactor}px`;
                    } else {
                        previewContentRef.current.style.transform = 'scale(1)';
                        previewWrapperRef.current.style.height = `${previewContentRef.current.offsetHeight}px`;
                    }
                }
            };

            useLayoutEffect(() => { if (step === 'summary') { updatePreviewScale(); const timer = setTimeout(updatePreviewScale, 150); window.addEventListener('resize', updatePreviewScale); return () => { clearTimeout(timer); window.removeEventListener('resize', updatePreviewScale); }; } }, [step, formData, essentials, carDamage, guidedPhotos, generalPhotos, signature]);

            useEffect(() => {
                const now = new Date();
                const dStr = now.toLocaleDateString('de-DE', {year: 'numeric', month: '2-digit', day: '2-digit'}).replace(/\./g, '-');
                const tStr = now.getHours().toString().padStart(2,'0') + now.getMinutes().toString().padStart(2,'0');
                const typeStr = mode === 'pickup' ? 'Uebernahme' : 'Rueckgabe';
                const plateStr = formData.plate ? formData.plate.replace(/[^a-zA-Z0-9]/g, '') : 'Fahrzeug';
                document.title = step === 'summary' ? `${dStr}_${tStr}_${typeStr}_${plateStr}` : `Vehicle Report v2.7.0`;
            }, [step, mode, formData.plate]);

            const compressImage = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                        };
                    };
                });
            };

            const resetApp = () => { setStep('mode'); setSignature(null); setGeneralPhotos([]); setGuidedPhotos({ frontLeft: null, frontRight: null, backLeft: null, backRight: null, wheelFL: null, wheelFR: null, wheelBL: null, wheelBR: null, dash: null, interior: null }); setEssentials({ docs: null, vest: null, triangle: null, firstAid: null, mats: null, spareTire: null, chargingCable: null }); setCarDamage({ front: { active: false, note: '', photo: null, label: 'Vorne' }, back: { active: false, note: '', photo: null, label: 'Hinten' }, left: { active: false, note: '', photo: null, label: 'Links' }, right: { active: false, note: '', photo: null, label: 'Rechts' }, roof: { active: false, note: '', photo: null, label: 'Dach' }, wheels: { active: false, note: '', photo: null, label: 'Felgen' }, glass: { active: false, note: '', photo: null, label: 'Glas' } }); setFormData({ plate: '', model: '', kilometers: '', fuelLevel: '100', renterName: '', rentalCompany: '', location: '', fuelType: 'Benzin', handoverType: 'Persönlich', date: new Date().toISOString().split('T')[0], keyCount: 1 }); };

            const handleFile = async (e, zone) => {
                const file = e.target.files[0];
                if (!file) return;
                const res = await compressImage(file);
                if (zone === 'general') { setGeneralPhotos(prev => [...prev, { id: Date.now(), url: res }]); }
                else if (guidedPhotos.hasOwnProperty(zone)) { setGuidedPhotos(prev => ({ ...prev, [zone]: res })); }
                else { setCarDamage(prev => ({ ...prev, [zone]: { ...prev[zone], photo: res, active: true } })); }
                e.target.value = null; 
            };

            const navigateTo = (target) => {
                const isElectric = ['Elektro', 'Hybrid'].includes(formData.fuelType);
                if (['photos', 'sign', 'summary'].includes(target) && step !== 'summary') {
                    const req = ['docs', 'vest', 'triangle', 'firstAid', 'mats', 'spareTire'];
                    if (isElectric) req.push('chargingCable');
                    if (!req.every(k => essentials[k] !== null)) { setShowError(true); setTimeout(() => setShowError(false), 2500); return; }
                }

                        {step === 'summary' && <div className="space-y-4 pb-10 fade-in text-center text-slate-900"><h2 className="text-xl font-black uppercase italic tracking-tighter no-print mb-4">Vorschau</h2><div ref={previewWrapperRef} className="w-full overflow-hidden bg-slate-300 rounded-xl shadow-inner mb-6 relative preview-auto-scale-wrapper print:h-auto print:overflow-visible print:bg-white print:shadow-none print:m-0"><div ref={previewContentRef} className="absolute top-0 left-0 origin-top-left preview-auto-scale-content print:relative print:transform-none print:w-full" style={{ width: '750px' }}><ProtocolDocument mode={mode} formData={formData} essentials={essentials} carDamage={carDamage} guidedPhotos={guidedPhotos} generalPhotos={generalPhotos} signature={signature} /></div></div><div className="space-y-3 no-print pt-4"><button type="button" onClick={() => window.print()} className="w-full bg-blue-600 text-white py-5 rounded-[24px] font-black text-lg uppercase flex items-center justify-center gap-3 shadow-2xl active:bg-blue-700 transition-all cursor-pointer"><Icon name="doc" size={24}/> DRUCKEN / SPEICHERN</button><button type="button" onClick={() => setStep('check')} className="w-full bg-white border-2 border-slate-300 text-slate-700 py-4 rounded-[24px] font-black text-sm uppercase flex items-center justify-center gap-2 active:bg-slate-50 transition-all shadow-md cursor-pointer mt-4 font-bold"><Icon name="pen" size={18}/> Schaden nachmelden / Aendern</button><button onClick={resetApp} className="w-full bg-slate-800 text-white py-4 rounded-[24px] font-black text-sm uppercase italic shadow-lg active:scale-95 flex items-center justify-center gap-2 cursor-pointer shadow-xl"><Icon name="refresh" size={18} /> FERTIG & NEU STARTEN</button></div><div className="scroll-spacer"></div></div>}
                    </main>

                    {step !== 'mode' && <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-slate-200 h-20 z-[900] no-print shadow-2xl pb-safe"><div className="nav-table"><div className="nav-cell"><button onClick={() => navigateTo('info')} className={`${step === 'info' ? 'text-blue-600 font-bold' : 'text-slate-400'} flex flex-col items-center justify-center w-full`}><Icon name="doc" size={18}/><span className="text-[8px] mt-0.5 font-bold uppercase">Daten</span></button></div><div className="nav-cell"><button onClick={() => navigateTo('check')} className={`${step === 'check' ? 'text-blue-600 font-bold' : 'text-slate-400'} flex flex-col items-center justify-center w-full`}><Icon name="shield" size={18}/><span className="text-[8px] mt-0.5 font-bold uppercase">Zustand</span></button></div><div className="nav-cell"><button onClick={() => navigateTo('photos')} className={`${step === 'photos' ? 'text-blue-600 font-bold' : 'text-slate-400'} flex flex-col items-center justify-center w-full`}><Icon name="camera" size={18}/><span className="text-[8px] mt-0.5 font-bold uppercase">Bilder</span></button></div><div className="nav-cell"><button onClick={() => navigateTo('sign')} className={`${step === 'sign' ? 'text-blue-600 font-bold' : 'text-slate-400'} flex flex-col items-center justify-center w-full`}><Icon name="pen" size={18}/><span className="text-[8px] mt-0.5 font-bold uppercase">Sign</span></button></div><div className="nav-cell"><button onClick={() => navigateTo('summary')} className={`${step === 'summary' ? 'text-blue-600 font-bold' : 'text-slate-400'} flex flex-col items-center justify-center w-full`}><Icon name="check" size={18}/><span className="text-[8px] mt-0.5 font-bold uppercase">Bericht</span></button></div></div></nav>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
